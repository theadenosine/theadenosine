<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Adenosine</title>
<style>
  :root {
    --black: #000;
    --panel: #111111;
    --line: #262626;
    --bone: #e9e6de;
    --bone-dim: #7d7a75;
    --red: #b91c26;
    --embed-h: clamp(120px, 34vw, 352px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
  }

  body {
    display: flex;
    flex-direction: column;
    position: relative;
    color: var(--bone);
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }

  /* ---------- CORNER LINK ---------- */
  .corner-link {
    position: absolute;
    top: clamp(12px, 2vh, 20px);
    left: clamp(14px, 2.5vw, 24px);
    z-index: 5;
    overflow: hidden;
    display: block;
    width: clamp(72px, 12vh, 108px);
    height: clamp(72px, 12vh, 108px);
    border-radius: 8px;
  }

  .corner-link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #000 url("golden-dusk.jpg") center / contain no-repeat;
    filter: blur(2px);
    z-index: -2;
  }

  .corner-link::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: -1;
    transition: background 0.2s ease;
  }

  .corner-link:hover::after {
    background: rgba(0, 0, 0, 0.35);
  }

  /* ---------- BANNER ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 4.5vh, 40px) 20px clamp(10px, 2vh, 18px);
    position: relative;
  }

  header img {
    max-height: clamp(180px, 34vh, 460px);
    width: auto;
    max-width: min(94vw, 900px);
    object-fit: contain;
  }

  /* ---------- EMBEDS ---------- */
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.6vh, 16px) clamp(10px, 2.5vw, 28px);
    min-height: 0;
  }

  .tracks {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: row;
    gap: clamp(10px, 1.6vw, 18px);
    overflow-x: auto;
  }

  .track-slot {
    flex: 1 1 0;
    min-width: 220px;
    height: var(--embed-h);
    position: relative;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }

  .track-slot:hover {
    border-color: #3d3d3d;
  }

  /* Spotify's widget renders at a fixed 352px tall no matter the iframe
     size, so we render it at that native height, then scale the whole
     thing up with a transform to fill the taller box with no dead space
     below it. Raise --embed-h to make the boxes taller; it gets slightly
     softer the more it's scaled up, since it's magnified pixels. */
  .track-slot iframe {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% / (var(--embed-h) / 352px));
    height: 352px;
    transform-origin: top left;
    transform: scale(calc(var(--embed-h) / 352px));
    border: 0;
  }

  /* ---------- FOOTER / LINKS ---------- */
  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: clamp(24px, 5vh, 44px) 20px clamp(28px, 5.5vh, 48px);
  }

  .listen-row {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .listen-link {
    flex: 1 1 260px;
    max-width: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: clamp(18px, 3.4vh, 26px) 26px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--bone);
    text-decoration: none;
    font-weight: 700;
    font-size: clamp(1rem, 1.6vh, 1.2rem);
    letter-spacing: 0.03em;
    border-radius: 8px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .listen-link:hover {
    border-color: var(--red);
    background: #161010;
  }

  .listen-link svg { flex-shrink: 0; width: 24px; height: 24px; }

  @media (max-width: 640px), (max-aspect-ratio: 3/4) {
    .corner-link {
      top: 100%;
      margin-top: 10px;
      left: clamp(14px, 3vw, 20px);
      width: clamp(52px, 9vh, 84px);
      height: clamp(52px, 9vh, 84px);
    }
    .listen-row { gap: 10px; }
    .listen-link { flex: 1 1 45%; font-size: 0.86rem; padding: 14px 12px; }
  }
</style>
</head>
<body>

  <!-- ============ BANNER ============ -->
  <header>
    <!-- Small link to another site. Replace href="#" with your Golden Dusk URL. -->
    <a class="corner-link" href="https://duskgolden.netlify.app" target="_blank" rel="noopener" aria-label="Golden Dusk"></a>
    <img src="banner.png" alt="Adenosine">
  </header>

  <!-- ============ SPOTIFY EMBEDS ============
       Replace each src with your own Spotify embed URL.
       Get it from Spotify: Share -> Embed track/album -> copy the src.
       Format: https://open.spotify.com/embed/track/TRACK_ID -->
  <main>
    <div class="tracks">
      <div class="track-slot">
        <iframe
          src="https://open.spotify.com/embed/track/0fEV8YPQfzhT0cYoEURXHd?"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="eager">
        </iframe>
      </div>
      <div class="track-slot">
        <iframe
          src="https://open.spotify.com/embed/track/4ZErCmfJTFw8IRLES6fPr4?"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>

        <iframe
          src="https://open.spotify.com/embed/track/4I3TPSD6nOVsUJxIXZkGSe?"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </main>

  <!-- ============ FOOTER LINKS ============

  <footer>
    <div class="listen-row">
      <a class="listen-link" href="https://open.spotify.com/intl-tr/artist/0PhnbB0ZhfGb1L46tAIRqz" target="_blank" rel="noopener">

        Spotify
      </a>
      <a class="listen-link" href="https://music.youtube.com/channel/UC_fOibKPsYeqw36-QrcuFag" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
        YouTube Music
      </a>
    </div>
  </footer>

</body>
</html>
